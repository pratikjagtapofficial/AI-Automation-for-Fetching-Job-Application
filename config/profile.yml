search:
  # Matched as SUBSTRINGS against the job title (see scorer._title_matches),
  # so "AI Engineer" catches "Senior AI Engineer" too -- seniority is
  # removed separately by exclude_titles below, which is why adding
  # variants here is safe.
  #
  # Widened 2026-08-19 after auditing what the filter was actually
  # discarding: 126 of 329 Hirist postings had clearly AI/ML-relevant
  # titles yet failed this list. The gap was spelling variants rather
  # than genuinely different roles -- "AI/ML Developer" and "Artificial
  # Intelligence Engineer" (the unabbreviated form, which "AI Engineer"
  # does NOT substring-match) are both common on Indian boards and both
  # were invisible. Verified after widening: the newly-matched postings
  # are still correctly rejected downstream when they deserve to be
  # (7 on "Senior", 1 each on Staff/Lead/Principal/II, 6 on years
  # required), so this widens genuine reach without weakening the
  # entry-level guarantee.
  titles:
    - AI Developer
    - AI Engineer
    - Associate AI Engineer
    - Agentic AI Engineer
    - GenAI Engineer
    - Generative AI Engineer
    - Machine Learning Engineer
    - ML Engineer
    - LLM Engineer
    - Applied AI Engineer
    - AI/ML Engineer
    # Spelling/word-order variants of the same roles above.
    - AI/ML Developer
    - AI ML Developer
    - ML Developer
    - Artificial Intelligence Engineer
    - Artificial Intelligence Developer
    - AI Application Developer
    - AI Application Engineer
    - AI Software Engineer
    - AI Software Developer
    - AI Python Developer
    - AI Automation Engineer
    - GenAI Developer
    - Generative AI Developer
    - AI Platform Engineer
    # Adjacent specialisations PJ has real, resume-backed skills in
    # (YOLO/Computer Vision, NLP, deep learning, MLOps-adjacent work).
    - Deep Learning Engineer
    - NLP Engineer
    - Computer Vision Engineer
    - Data Science Engineer
    - MLOps Engineer

  exclude_titles:
    [Senior, Sr., Staff, Lead, Principal, Manager, Head, Director,
     Architect, "II", "III", Founding, VP, Chief,
     # Not employment. PJ is employed and looking for a full-time move;
     # internships stay allowed, freelance/contract gigs do not.
     Freelancer, Freelance, Contractor, Part-time, Trainer, Faculty,
     Professor, Instructor]

  # Reverted 3 -> 2 (2026-08-11). The 2->3 widen was meant only to help
  # "0-3 Yrs" postings pass -- but a "0-3 Yrs" posting's floor is 0, which
  # always passes this check regardless of the ceiling value, so the
  # widen was never actually needed for that case. Its only real effect
  # was a boundary bug: the check is `min_yrs > experience_years_max`, so
  # at 3 a posting whose OWN minimum is exactly 3 ("3-5 Yrs", "3-6 Yrs",
  # "3-12 Yrs") also passed -- confirmed live 2026-08-11 against three
  # real Hirist postings (Adapt Ready, Hityaglobal, True Credits) that
  # explicitly state a 3-year floor on their own site yet scored
  # 49/67/52 and were tailored and sent to PJ, who has ~11 months
  # experience. Back at 2, "0-3 Yrs" postings still pass (floor 0), and
  # genuinely 3+-year postings are rejected again.
  experience_years_max: 2

  locations:
    - {name: Remote,     weight: 1.30}
    - {name: Pune,       weight: 1.20}
    - {name: Bengaluru,  weight: 1.00}
    - {name: Hyderabad,  weight: 1.00}
    - {name: Noida,      weight: 0.95}
    - {name: Gurugram,   weight: 0.95}
    - {name: India,      weight: 0.90}

  # Widened again 168 -> 720 (30 days) on 2026-08-19, for the same reason
  # it went 24 -> 168: this window's original job (stopping repeat
  # notifications) is already done by the tracker's dedupe, so its only
  # remaining effect is discarding postings PJ has never seen. Measured
  # on a live Hirist pull: 13 postings passed every other filter --
  # right title, right location, entry-level experience -- and were
  # dropped purely for age. A four-week-old posting PJ has never seen is
  # still worth applying to; a genuinely filled role costs him one
  # ignored Telegram card, which is much cheaper than a missed match.
  # Kept finite rather than removed: past ~a month, listings on these
  # boards are mostly stale reposts.
  freshness_hours: 720

  # Official postings only — company's own listing, not an agency repost.
  official_only: true

  # Sources that publish no posting date at all. These skip the freshness
  # check rather than being dropped, and are labelled "date unknown" — a
  # date is never invented for them. Dedupe still shows each job once.
  undated_sources: [instahyre]

blacklist:
  companies:
    - HireTalent
    # IT staffing firms that reached the Telegram cards from Foundit on
    # 2026-08-19. Listed by name rather than by adding "solutions" to the
    # keyword stems below, which would also block real employers
    # (Salvo Software, Zoho-style names, etc). Foundit reports EVERY
    # employer as employerTypes=['Company'], including these two, so its
    # own data cannot distinguish them -- the name list is the only gate.
    # Remove either if PJ decides he does want to hear from them.
    - Teamware Solutions
    - BayOne Solutions
  client_companies: []     # TODO(PJ): critical for the quiet search
  keywords:
    # Substring-matched against the company name. "Telomere Consulting"
    # slipped through when only "consultancy" was listed, so stems are
    # used rather than exact words.
    [staffing, recruit, consultanc, consulting, consultants, manpower,
     talent solutions, talent acquisition, hiring partner, rpo, headhunt,
     placement, hr services, hr solutions, outsourcing, resourcing]

limits:
  applications_per_day: 20
  strong_fit_threshold: 70    # >= this gets a live ping rather than the digest
  min_score_to_show: 40       # below this is dropped entirely

  # Tailoring runs for anything at or above this. Set to match
  # min_score_to_show because observed scores cluster at 50-75: gating
  # tailoring at 70 meant most matches were never tailored at all, which
  # defeats the point. Volume is 2-5 jobs/run, so the Gemini free tier
  # absorbs this comfortably.
  tailor_threshold: 40

  # Cap roles shown per employer per run. One company posting many
  # near-identical variants (Deutsche Telekom: 8+ AI Engineer listings in
  # a single scan) would otherwise crowd out every other match.
  max_per_company: 3

  # Ceiling on tailoring calls per run. Guards the Gemini free tier if a
  # scan ever returns an unusually large batch.
  max_tailor_per_run: 12

  # Phase 3. Applications are PREPARED only — filled, screenshotted and
  # handed to PJ. Nothing is ever submitted by the system.
  prepare_applications: true
  # Each preparation drives a real browser (~25s), so this bounds both
  # runtime and Actions minutes.
  max_prepare_per_run: 4

  # Instahyre's API has no JD text; a real browser fetch of each
  # shortlisted job page is needed to verify experience. Bounded because
  # each fetch launches Chromium (~3-5s); default covers a normal shortlist.
  max_instahyre_enrich: 20
