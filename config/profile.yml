# ─────────────────────────────────────────────────────────────────
# SKILLS WHITELIST
# The Validator rejects any resume edit introducing a skill not listed
# under `has`. Hard-coded gate, not an LLM judgement call.
# ─────────────────────────────────────────────────────────────────
skills:
  has:
    agentic_genai:
      [AI Agents, Multi-Agent Systems, Agentic AI, Model Context Protocol, MCP,
       Agent-to-Agent Protocol, A2A, LangChain, LangGraph, RAG,
       Retrieval-Augmented Generation, Prompt Engineering]
    llm_platforms:
      [Claude Code, Gemini, GPT, Large Language Models, LLMs]
    programming:
      [Python, SQL, FastAPI, Streamlit, REST API]
    retrieval:
      [Vector Databases, PostgreSQL, PageIndex, Semantic Search]
    ml_ds:
      [XGBoost, LSTM, Scikit-learn, NLP, Time-Series Forecasting,
       Predictive Modeling, Feature Engineering]
    vision:
      [YOLO, Computer Vision]
    cloud_infra:
      # Real deployment experience — Agent Neo runs on Vultr.
      [DigitalOcean, Vultr, Cloudflare, Git, GitHub]

  # Skills held only lightly. Allowed on the resume, but the call-prep
  # card warns PJ so he never oversells them in an interview.
  shallow:
    LangGraph: >-
      Used lightly. Honest line: "I've worked with it a little — most of my
      orchestration has been direct LangChain and MCP."

  lacks:
    # NEVER add these to a resume, cover letter, or screening answer.
    - CrewAI
    - AutoGen
    - Docker
    - Kubernetes
    - AWS
    - Azure
    - GCP
    - Terraform

  gap_framing:
    default: >-
      Not hands-on with this yet. I've shipped the application layer of LLM
      systems end to end, and I pick up tooling quickly.
    Docker: >-
      Haven't used it in production. I've deployed FastAPI services to Vultr
      and DigitalOcean, so deployment concepts are familiar — containers are
      the piece I'd be ramping on.
    AWS: >-
      My deployment experience is DigitalOcean, Vultr and Cloudflare rather
      than AWS. Same fundamentals — managed services, DNS, storage — and I'd
      expect a short ramp.
    Kubernetes: >-
      No hands-on orchestration experience. I've run production services on
      VPS infrastructure and would be learning K8s from the ground up.

