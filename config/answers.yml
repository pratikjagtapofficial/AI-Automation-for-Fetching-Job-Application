# THE ANSWER BANK
#
# Every value here was written by PJ. Nothing in this file is ever
# generated by a model, and nothing is ever inferred from a job
# description or a previous answer.
#
# WHY THIS IS A FILE AND NOT A PROMPT:
# An LLM asked "how many years of Kubernetes experience?" will produce a
# plausible number. That number goes onto a real application, under PJ's
# name, to a real employer. So the rule is absolute: if a question has no
# entry here, the application PAUSES and the bot asks PJ in Telegram. His
# reply is appended here and reused. Unknown is never filled in.
#
# `null` means genuinely unknown -> will trigger a Telegram prompt.

