# Structured resume — the tailoring source of truth.
#
# Base changed 2026-08-07 to Pratik_Jagtap_Resume_Jr_AIML_Engineer.pdf, per
# PJ's instruction: keep THIS resume — same layout, same colours — and
# tailor per JD from here on. Bullet ids are unchanged from the prior
# base so nothing downstream (tailor.py, validator.py, the stored
# tailoring history in the tracker) needed restructuring — only the
# wording, headline, summary and skill groupings changed to match this
# file's actual content, verbatim.
#
# WHY YAML AND NOT THE .docx:
# Tailoring means selecting and rephrasing *specific bullets* per job.
# Editing a Word file blindly is where these systems produce garbage —
# broken formatting, duplicated sections, silently dropped content. Here
# each bullet is addressable data, the tailor may only reorder/reword
# existing entries, and rendering is deterministic.
#
# RULES:
#  * `text` is PJ's own wording and is never overwritten. Tailoring
#    produces a variant; the original always remains recoverable.
#  * `tags` drive relevance matching against a JD. Every tag must exist
#    in profile.yml skills.has — the Validator enforces this.
#  * `locked: true` means never rewrite (facts, dates, titles).

