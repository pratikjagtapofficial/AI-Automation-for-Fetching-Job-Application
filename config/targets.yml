# ATS board slugs to poll.
#
# ⚠️  These are CANDIDATES, not verified facts. Company ATS slugs change
# and cannot be reliably guessed. Run:
#
#     python scripts/verify_boards.py
#
# ...which tests every slug against the live API and rewrites this file
# with only the ones that actually respond. Never trust an unverified
# slug — a wrong one fails silently and you lose a source without noticing.
#
# status: unverified = never tested · ok = responded · dead = 404/empty

