# ─────────────────────────────────────────────────────────────────
# Sources requiring scraping (Phase 3+, Playwright / Apify credits).
# Deliberately NOT enabled in Phase 1 — the ATS APIs above are free,
# unlimited, and give real posting timestamps.
# ─────────────────────────────────────────────────────────────────
scraped_sources:
  naukri:      {enabled: false, phase: 4, method: apify}
  linkedin:    {enabled: false, phase: 4, method: apify, note: "read-only, never automate applying"}
  indeed:      {enabled: false, phase: 4, method: connector}
  instahyre:   {enabled: false, phase: 4, method: playwright}
  wellfound:   {enabled: false, phase: 4, method: playwright}
  cutshort:    {enabled: false, phase: 4, method: playwright}
