name: Job Scout

# Runs on GitHub's infrastructure — PJ's laptop is irrelevant once this
# is pushed. Times are UTC; IST is UTC+5:30.
#   20:00 UTC = 01:30 IST (next day)
#
# Collapsed from twice daily to once, per PJ (2026-08-11): back-to-back
# scans in close succession were making Instahyre's bot detection block
# essentially every enrichment fetch (confirmed live — 20/20 blocked on
# a run only 16 minutes after the previous one), and running once
# nightly avoids that. Naukri and careerpages coverage was rebalanced
# in scout.py to stay full-coverage and cost-neutral with only one run
# (see NAUKRI_KEYWORDS and the careerpages call there).
on:
  schedule:
    - cron: "0 20 * * *"    # 01:30 IST
  workflow_dispatch:         # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Scan and log, but send nothing to Telegram"
        type: boolean
        default: false
  repository_dispatch:       # fired by /scan from Telegram
    types: [run-scout]

# Shared with command.yml (2026-08-11): both this workflow AND command.yml
# write to data/jobs.db, and that's a binary SQLite file -- `git rebase`
# cannot 3-way-merge two conflicting binary changes the way it can with
# text, so if a scheduled scan and a dispatched command (e.g. /apply)
# ever ran at the same time, the loser's push would fail outright and no
# amount of retrying would fix it, since the conflict is real content
# overlap, not just timing. Confirmed live: this caused two of the last
# three "Job scout failed" alerts. Giving both workflows the SAME
# concurrency group name makes GitHub Actions queue them instead of
# racing them -- the real fix is never letting the collision happen, not
# trying to resolve it after the fact.
concurrency:
  group: jobs-db-writer
  cancel-in-progress: false

permissions:
  contents: write            # to commit the updated tracker DB

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # guard against a hung request burning minutes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        # Needed by the application filler. --with-deps pulls the system
        # libraries the Ubuntu runner does not ship by default.
        run: python -m playwright install --with-deps chromium

      - name: Answer pending Telegram commands
        # Commands sent between scheduled runs are answered here. Not
        # instant -- a webhook is the fix for that -- but it means /status
        # and /brief still work without an always-on host.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -m src.bot --once

      - name: Run scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Without this the tailor silently fails on every scheduled run
          # and PJ gets untailored cards with no obvious cause.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.scout

      - name: Persist tracker
        # The SQLite file is the dedupe memory. Without committing it back,
        # every run would treat every posting as new and re-notify.
        #
        # Confirmed live 2026-08-10: two of the last three "Job scout
        # failed" alerts were this step's `git push` racing a concurrent
        # command.yml push (a dispatched /apply, or CONFIRM) to the same
        # data/jobs.db. The real fix is the shared `jobs-db-writer`
        # concurrency group above, which stops that race from happening at
        # all. This retry loop (matching social.yml's proven pattern) is
        # defense in depth for anything else transient -- it only fails
        # loudly, triggering the alert below, if 5 attempts all fail.
        run: |
          git config user.name  "job-scout[bot]"
          git config user.email "job-scout@users.noreply.github.com"
          git add data/jobs.db
          git diff --staged --quiet && exit 0
          git commit -m "tracker: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt) — rebasing onto latest main and retrying"
            git pull --rebase --autostash origin main
            sleep $((attempt * 3))
          done
          echo "::error::could not push data/jobs.db after 5 attempts"
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # A silent failure is the dangerous one — PJ would assume the
        # pipeline is running while it has been dead for weeks.
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🚨 <b>Job scout failed</b>%0ARun: ${{ github.run_id }}%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs →</a>"

  # GitHub disables scheduled workflows after 60 days of repository
  # inactivity. This weekly no-op commit keeps the schedule alive.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat weekly
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            git config user.name  "job-scout[bot]"
            git config user.email "job-scout@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git diff --staged --quiet || git commit -m "chore: keepalive"
            git push
          fi
